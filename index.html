<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --h:#000; --p:#fff; --abu:#555; --kuning:#FFF176;
    --c-enam: polygon(25% 0, 75% 0, 100% 50%, 75% 100%, 25% 100%, 0 50%);
    --c-lima: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%);
  }
  * { box-sizing: border-box; }
  body { padding-bottom:84px; margin:0; background-color:var(--p); color:var(--h); font-family:Arial, Helvetica, sans-serif; line-height:1.35; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between;
           max-width:1200px; margin:0 auto; padding:22px 24px 10px; }
  h1 { margin:0; font-size:clamp(11px, 2.9vw, 26px); font-weight:400; white-space:nowrap; }
  h1 b { font-weight:700; }
  @media (max-width:640px) {
    h1 { font-size:21px; white-space:normal; line-height:1.25; }
  }
  footer { max-width:1200px; margin:0 auto; padding:0 24px 16px; text-align:left; font-size:11px; color:var(--h); }
  @media (min-width:900px) {
    footer { position:fixed; left:0; bottom:0; margin:0; padding:0 0 10px 16px; z-index:15; pointer-events:none; }
  }
  .judul { flex:1 1 auto; min-width:0; }
  #timer { font-size:13px; margin-top:4px; }
  #login { display:flex; align-items:center; gap:10px; font-size:14px; min-height:40px; }

  /* deretan tombol bentuk */
  #alat { position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:14px;
          padding:10px 16px calc(10px + env(safe-area-inset-bottom)); font-size:14px; pointer-events:none; }
  #alat > * { pointer-events:auto; }
  .petunjuk { color:var(--h); background:#fff; padding:4px 10px; }
  #titik { position:fixed; inset:0; width:100%; height:100%; z-index:-1; pointer-events:none; }
  .ikon { width:34px; height:34px; background:#9a9a9a; border:none; padding:0; cursor:pointer; flex-shrink:0; }
  .ikon.kecil { width:26px; height:26px; }
  .ikon:hover, .ikon.pilih { background:var(--h); }
  .ikon.pilih { transform:scale(1.12); }
  .ikon.b-lingkaran { border-radius:50%; }
  .ikon.b-enam { clip-path:var(--c-enam); }
  .ikon.b-ledak { clip-path:var(--c-ledak); }
  .ikon.b-lima { clip-path:var(--c-lima); }
  .ikon.b-tumpul { border-radius:7px; height:22px; margin:6px 0; }
  .ikon.kecil.b-tumpul { height:17px; margin:4px 0; border-radius:5px; }

  .dek { display:grid; grid-template-columns:repeat(auto-fill, minmax(310px, 1fr)); gap:30px 26px;
         align-items:start; max-width:1200px; margin:0 auto; padding:14px 24px 40px; }

  /* kartu */
  .kartu { background:var(--kuning); border:none; padding:16px 18px; }
  .kartu, .balas { font-family:'Shantell Sans','Segoe Print','Bradley Hand',cursive; }
  .item { transform:translateX(var(--dx,0)) rotate(var(--rot,0)); margin-top:var(--dy,0); }
  .kepala { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .lencana { display:inline-flex; align-items:center; justify-content:center; width:17px; height:17px; margin-left:6px;
             border-radius:50%; background:#1d9bf0; color:#fff; font-size:12px; font-weight:900; line-height:1;
             vertical-align:2px; cursor:help; }
  .nama { font-weight:700; font-size:17px; overflow-wrap:anywhere; }
  .membalas { color:var(--abu); font-size:12px; margin-top:6px; overflow-wrap:anywhere; }
  .kartu.lain .membalas { order:1; text-align:center; margin-top:2px; }
  .balas > .bawah { margin-top:8px; font-size:13px; }
  .balas > .bawah .btn { font-size:12px; padding:3px 10px; }
  .kompos.popup { position:relative; z-index:4; margin:12px 0 4px; padding-top:8px; }
  .kompos.popup::before { content:''; position:absolute; top:-2px; left:34px; border:9px solid transparent; border-bottom-color:#000; border-top:0; }
  .ke { font-size:13px; color:var(--abu); margin:0 0 4px 4px; }
  .waktu { color:var(--abu); font-size:14px; margin-top:2px; }
  .teks { margin:10px 0 12px; text-align:justify; white-space:pre-wrap; overflow-wrap:anywhere; font-size:16px; }
  .aksi { display:flex; gap:6px; flex-shrink:0; }
  .bawah { display:flex; align-items:center; gap:12px; font-size:14px; color:var(--abu); }
  .kartu.lain .bawah { order:4; justify-content:center; gap:8px; margin-top:6px; font-size:12px; }
  .kartu.lain .bawah .btn { font-size:12px; padding:3px 10px; }

  /* bentuk selain persegi */
  .kartu.lain { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center;
                width:100%; max-width:330px; margin-left:auto; margin-right:auto; }
  .kartu.b-lingkaran { aspect-ratio:1; border-radius:50%; padding:15% 14%; }
  .kartu.b-enam { aspect-ratio:1.15; clip-path:var(--c-enam); padding:8% 19%; }
  .kartu.b-lima { aspect-ratio:1; clip-path:var(--c-lima); padding:24% 20% 9%; }
  .kartu.b-ledak { aspect-ratio:1.3; clip-path:var(--c-ledak); padding:15% 17%; }
  .kartu.b-tumpul { aspect-ratio:1.7; border-radius:22px; padding:7% 8%; }
  .kartu.lain .kepala { display:contents; }
  .kartu.lain .kepala > div:first-child { order:1; }
  .kartu.lain .nama { font-size:15px; }
  .kartu.lain .waktu { font-size:12px; margin-top:0; white-space:nowrap; }
  .kartu.lain .teks { order:2; margin:6px 0 8px; text-align:center; font-size:14px; }
  .kartu.lain .aksi { order:3; justify-content:center; }
  .kartu.lain .btn.garis { font-size:12px; padding:3px 8px; }

  /* tombol */
  .btn { font:inherit; font-size:14px; white-space:nowrap; background:var(--h); color:var(--p); border:2px solid transparent;
         border-radius:0; padding:6px 14px; cursor:pointer; }
  .btn:hover:not(:disabled) { background:var(--p); color:var(--h); }
  .btn:disabled { opacity:.45; cursor:wait; }
  .btn.garis { background:var(--p); color:var(--h); padding:4px 10px; }
  .btn.garis:hover:not(:disabled) { background:var(--h); color:var(--p); }
  .aksi .btn { font-weight:700; }
  .btn.garis.aktif { background:var(--h); color:var(--p); }

  /* tumpukan balasan */
  .tumpukan { margin:0; }
  .balas { border:none; background:var(--kuning); margin-top:6px; padding:12px 16px; position:relative; }
  .deck { position:relative; }
  .deck.berbalas > .kartu { cursor:pointer; position:relative; z-index:2; }
  .deck > .lapis { position:absolute !important; inset:0; z-index:1; pointer-events:none; aspect-ratio:auto !important; }
  .lapis.kartu { padding:0; }
  .lapis.kartu.lain { display:block; }
  .panah { display:inline-block; transition:transform .2s; }
  .balas .teks { margin:8px 0 0; font-size:15px; }

  /* kartu penulis (pratinjau langsung) */
  .kompos { margin-bottom:6px; }
  .tulis input.in-nama { background:transparent; border:none; border-bottom:1px dashed rgba(0,0,0,.35); font-weight:700;
                         font-size:17px; padding:2px 4px; width:100%; text-align:inherit; }
  .tulis textarea { background:transparent; border:none; resize:none; min-height:0; width:100%; padding:6px 4px;
                    font-size:16px; line-height:1.35; text-align:inherit; }
  .tulis input:focus, .tulis textarea:focus { outline:none; background:rgba(255,255,255,.25); }
  .kartu.lain.tulis input.in-nama { font-size:15px; }
  .kartu.lain.tulis textarea { font-size:14px; }
  .kontrol { display:flex; flex-direction:column; gap:8px; margin-top:12px; font-size:14px;
             background:rgba(255,255,255,.85); padding:10px 12px; }
  .baris { display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:13px; color:var(--abu); }
  .tombol { display:flex; gap:8px; }
  .warna, .bentuk-baris { display:flex; flex-wrap:wrap; align-items:center; gap:7px; font-size:14px; }
  .warna button { width:22px; height:22px; border:none; border-radius:50%; padding:0; cursor:pointer; }
  .warna button.pilih { outline:2px solid var(--h); outline-offset:2px; }

  #toast { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:var(--h); color:var(--p);
           padding:16px 26px; font-size:16px; line-height:1.4; text-align:center; display:none; max-width:min(90vw, 420px);
           z-index:100; pointer-events:none; box-shadow:0 0 0 6px rgba(255,255,255,.85); }
  #banner { max-width:1200px; margin:0 auto; padding:0 24px; font-size:14px; }
  #banner div { border:2px dashed var(--h); padding:10px 14px; margin:8px 0; }
</style>
</head>
<body>
<canvas id="titik" aria-hidden="true"></canvas>

<header>
  <div class="judul">
    <h1><b>deck</b> : Tempel tanya, tumpuk jawab, naikkan yang penting.</h1>
    <div id="timer"></div>
  </div>
  <div id="login"></div>
</header>
<nav id="alat"></nav>
<div id="banner"></div>
<main class="dek" id="dek"></main>
<footer>
  by Nurfahmi Muchlis - Arsitektur ITS | 2026
</footer>
<div id="toast"></div>

<script>
/* ================== KONFIGURASI (ISI 3 BARIS INI) ================== */
const CONFIG = {
  SCRIPT_URL: 'https://script.google.com/macros/s/AKfycbwTMSnLo2KrqkBn9MMOKKgE9guds3sw_qhuKXm6P5yNwjhnOkMar1WuJusq5I4PRhnc/exec',
  CSV_URL: 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRxTerBhSyjU3ZjVIaujJybJuMe3g2kZFdxYXpvTj98SzKjZwZAaCo7Nw_KRIqMCGp3I-638KlHb6fz/pub?gid=278077816&single=true&output=csv',
  GOOGLE_CLIENT_ID: '430383809546-5h6giln88c0bvl9oqta45tiiurs1mlf8.apps.googleusercontent.com',
  REFRESH_MS: 30000,
  MAKS_USERNAME: 20
};
/* Catatan: kosongkan CSV_URL ('') jika ingin membaca langsung lewat Apps Script (lebih cepat, tanpa jeda cache ~5 menit). */

/* ================== STATE ================== */
const siap = v => v && !String(v).startsWith('GANTI');
let dataServer = [];          // dari CSV / API
let lokal = [];               // postingan yang baru saya kirim (menunggu CSV terbarui)
let override = {};            // jumlah up/down terbaru dari server setelah saya vote
let sayaVote = {};            // { idPost: 1 | -1 }
let dekBuka = null;           // id post yang tumpukan balasannya sedang terbuka (hanya satu)
let balasKe = null;           // id balasan yang sedang dibalas (null = membalas post induk)
let balasTerbuka = null;      // id post yang kartu balasnya sedang terbuka
let komposBuka = false;       // kartu penulis baru baru tampil setelah memilih bentuk di atas
let draft = {};               // isi kartu penulis yang belum terkirim
let token = sessionStorage.getItem('tok') || '';

/* ================== UTIL ================== */
const WARNA = ['#000000', '#1d4ed8', '#b91c1c', '#15803d', '#7e22ce', '#be185d'];   // harus sama dengan WARNA di Kode.gs
function cekWarna(w) { w = String(w || '').toLowerCase(); return WARNA.includes(w) ? w : WARNA[0]; }
const KARTU = { kuning: '#FFF176', pink: '#F8BBD0', biru: '#B3E5FC', hijau: '#C8E6C9', oranye: '#FFCC80', ungu: '#D1C4E9' };  // nama harus sama dengan KARTU di Kode.gs
function cekKartu(k) { k = String(k || '').toLowerCase(); return KARTU[k] ? k : 'kuning'; }
// batas huruf per bentuk (angka harus sama dengan BENTUK di Kode.gs)
const BENTUK = {
  persegi:  { label: 'Persegi',   maks: 200, baris: 4 },
  lingkaran:{ label: 'Lingkaran', maks: 120, baris: 4 },
  enam:     { label: 'Segi enam', maks: 120, baris: 4 },
  lima:     { label: 'Segi lima', maks: 100, baris: 3 },
  tumpul:   { label: 'Persegi panjang', maks: 120, baris: 4 },
  ledak:    { label: 'Ledakan',   maks: 80,  baris: 3 }
};
// bentuk ledakan: bintang bergerigi (jumlah gerigi sengaja sedikit agar jelas di layar HP)
(function () {
  const ujung = 16, luar = 50, dalam = 41, titik = [];
  for (let i = 0; i < ujung * 2; i++) {
    const r = i % 2 ? dalam : luar, a = Math.PI * i / ujung - Math.PI / 2;
    titik.push((50 + r * Math.cos(a)).toFixed(1) + '% ' + (50 + r * Math.sin(a)).toFixed(1) + '%');
  }
  document.documentElement.style.setProperty('--c-ledak', 'polygon(' + titik.join(', ') + ')');
})();
function cekBentuk(b) { b = String(b || '').toLowerCase(); return Object.prototype.hasOwnProperty.call(BENTUK, b) ? b : 'persegi'; }
const BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function fmt(w) {
  const d = new Date(w); if (isNaN(d)) return '';
  const p = n => String(n).padStart(2, '0');
  return `${p(d.getHours())}.${p(d.getMinutes())} – ${d.getDate()} ${BLN[d.getMonth()]} ${d.getFullYear()}`;
}
function acak(id, n) { let x = 0; for (const c of id + n) x = (x * 31 + c.charCodeAt(0)) >>> 0; return (x % 1000) / 1000; }
function h(tag, a = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if (c != null && c !== false) e.append(c); });
  return e;
}
let tToast;
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(tToast); tToast = setTimeout(() => t.style.display = 'none', 3500);
}
const getUser = () => localStorage.getItem('deck_user') || '';
const setUser = v => localStorage.setItem('deck_user', v);
const getWarna = () => cekWarna(localStorage.getItem('deck_warna'));
const getKartu = () => cekKartu(localStorage.getItem('deck_kartu'));
const getBentuk = () => cekBentuk(localStorage.getItem('deck_bentuk'));
function ambilDraft(kunci) {
  return draft[kunci] = draft[kunci] || { u: getUser(), t: '', w: getWarna(), k: getKartu(), b: getBentuk() };
}
function ubahBentuk(d, b) {
  d.b = b; d.t = d.t.slice(0, BENTUK[b].maks);
  localStorage.setItem('deck_bentuk', b);
}

/* ================== CSV ================== */
function parseCSV(t) {
  const rows = []; let r = [], c = '', q = false;
  for (let i = 0; i < t.length; i++) {
    const ch = t[i];
    if (q) { if (ch === '"') { if (t[i + 1] === '"') { c += '"'; i++; } else q = false; } else c += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { r.push(c); c = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && t[i + 1] === '\n') i++; r.push(c); c = ''; rows.push(r); r = []; }
    else c += ch;
  }
  if (c !== '' || r.length) { r.push(c); rows.push(r); }
  return rows;
}
function dariCSV(teks) {
  const rows = parseCSV(teks); if (rows.length < 2) return [];
  const kop = rows[0].map(s => s.trim().toLowerCase());
  return rows.slice(1).map(r => { const o = {}; kop.forEach((k, i) => o[k] = r[i] ?? ''); return o; });
}
function normal(o) {
  return { id: String(o.id || '').trim(), parent: String(o.parent_id || '').trim(), waktu: o.waktu,
           username: String(o.username || ''), teks: String(o.teks || ''), warna: cekWarna(o.warna), kartu: cekKartu(o.kartu),
           membalas: String(o.membalas || '').slice(0, 40), ke: String(o.ke || '').trim(), bentuk: cekBentuk(o.bentuk), dosen: String(o.dosen || '').trim().toLowerCase() === 'ya',
           up: parseInt(o.up) || 0, down: parseInt(o.down) || 0 };
}

/* ================== MUAT DATA ================== */
async function muat(otomatis) {
  if (otomatis && (document.hidden || sedangMengetik())) return;
  try {
    let daftar = [];
    if (siap(CONFIG.CSV_URL)) {
      const u = CONFIG.CSV_URL + (CONFIG.CSV_URL.includes('?') ? '&' : '?') + 't=' + Date.now();
      const r = await fetch(u, { cache: 'no-store' });
      daftar = dariCSV(await r.text());
    } else if (siap(CONFIG.SCRIPT_URL)) {
      const r = await fetch(CONFIG.SCRIPT_URL + '?aksi=daftar');
      daftar = (await r.json()).posts || [];
    }
    dataServer = daftar.map(normal).filter(p => p.id && p.teks);
    render();
  } catch (e) { if (!otomatis) toast('Gagal memuat data.'); }
}
function sedangMengetik() {
  const a = document.activeElement;
  return a && (a.tagName === 'TEXTAREA' || a.tagName === 'INPUT') && document.getElementById('dek').contains(a);
}
function semua() {
  const m = new Map();
  dataServer.forEach(p => m.set(p.id, { ...p }));
  lokal.forEach(p => { if (!m.has(p.id)) m.set(p.id, { ...p }); });
  const now = Date.now();
  for (const [id, o] of Object.entries(override)) {
    const p = m.get(id); if (p && now - o.t < 360000) { p.up = o.up; p.down = o.down; }
  }
  return [...m.values()];
}
const skor = p => p.up - p.down;
const urut = (a, b) => skor(b) - skor(a) || new Date(b.waktu) - new Date(a.waktu);

/* ================== PANGGIL APPS SCRIPT ================== */
const PESAN = {
  LOGIN: 'Sesi login habis. Silakan masuk lagi dengan Google.',
  DILARANG: 'Akun Google Anda tidak ada dalam daftar yang boleh posting.'
};
async function panggil(isi) {
  if (!siap(CONFIG.SCRIPT_URL)) throw new Error('SCRIPT_URL belum diisi.');
  const r = await fetch(CONFIG.SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },   // tanpa preflight CORS
    body: JSON.stringify({ ...isi, token })
  });
  const j = await r.json();
  if (!j.ok) {
    if (j.error === 'LOGIN') keluar(true);
    throw new Error(PESAN[j.error] || j.error || 'Terjadi kesalahan.');
  }
  return j;
}

/* ================== LOGIN GOOGLE ================== */
function tokenHidup() {
  if (!token) return false;
  try {
    const p = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
    return p.exp * 1000 > Date.now() + 30000;
  } catch (e) { return false; }
}
function initGoogle() {
  if (!siap(CONFIG.GOOGLE_CLIENT_ID)) return renderLogin();
  if (!window.google || !google.accounts) return setTimeout(initGoogle, 300);
  google.accounts.id.initialize({
    client_id: CONFIG.GOOGLE_CLIENT_ID,
    callback: async r => { token = r.credential; sessionStorage.setItem('tok', token); await sapa(); }
  });
  renderLogin();
}
function renderLogin() {
  const el = document.getElementById('login'); el.innerHTML = '';
  if (tokenHidup()) {
    el.append(h('button', { class: 'btn', onclick: () => keluar() }, 'Keluar'));
  } else if (siap(CONFIG.GOOGLE_CLIENT_ID) && window.google && google.accounts) {
    const slot = h('div'); el.append(slot);
    google.accounts.id.renderButton(slot, { theme: 'outline', size: 'medium', text: 'signin_with' });
  } else {
    el.append(h('span', {}, 'Login belum dikonfigurasi'));
  }
}
async function sapa() {
  try { const j = await panggil({ aksi: 'saya' }); sayaVote = j.votes || {}; toast('Berhasil masuk.'); }
  catch (e) { toast(e.message); keluar(true); }
  renderLogin(); render();
}
function keluar(diam) {
  token = ''; sessionStorage.removeItem('tok'); sayaVote = {};
  renderLogin(); if (!diam) toast('Anda sudah keluar.'); render();
}
function butuhLogin() {
  if (tokenHidup()) return true;
  token = ''; renderLogin(); toast('Masuk dengan akun Google dulu.'); return false;
}

/* ================== AKSI ================== */
async function vote(id, n, btn) {
  if (!butuhLogin()) return;
  btn.disabled = true;
  try {
    const j = await panggil({ aksi: 'vote', id, nilai: n });
    sayaVote[id] = j.saya; override[id] = { up: j.up, down: j.down, t: Date.now() };
  } catch (e) { toast(e.message); }
  render();
}
async function kirim(kunci, parent, btn, ke) {
  if (!butuhLogin()) return;
  const d = ambilDraft(kunci);
  const u = d.u.trim(), t = d.t.trim();
  if (!u) return toast('Isi username dulu.');
  if (!t) return toast('Tulis sesuatu dulu.');
  if (t.length > BENTUK[d.b].maks) return toast(`Teks terlalu panjang untuk bentuk ini (maks ${BENTUK[d.b].maks}).`);
  btn.disabled = true;
  try {
    const j = await panggil({ aksi: 'post', username: u, teks: t, parent: parent || '', membalas: ke ? ke.id : '', warna: d.w, kartu: d.k, bentuk: d.b });
    lokal.push(normal(j.post)); setUser(u);
    localStorage.setItem('deck_warna', d.w); localStorage.setItem('deck_kartu', d.k); localStorage.setItem('deck_bentuk', d.b);
    delete draft[kunci];
    if (parent) { balasTerbuka = null; balasKe = null; dekBuka = parent; } else komposBuka = false;
    toast('Terkirim ✓');
  } catch (e) { toast(e.message); }
  renderAlat(); render();
}

/* ================== TOMBOL BENTUK DI ATAS ================== */
function pilihBentukBaru(b) {
  const d = ambilDraft('baru');
  if (komposBuka && d.b === b) komposBuka = false;      // klik bentuk yang sama = tutup kartu penulis
  else { komposBuka = true; ubahBentuk(d, b); }
  renderAlat(); render();
  if (komposBuka) requestAnimationFrame(() => { const k = document.querySelector('#dek .kompos'); if (k) k.scrollIntoView({ block: 'center', behavior: 'smooth' }); });
}
function renderAlat() {
  const el = document.getElementById('alat'); el.innerHTML = '';
  const aktif = komposBuka ? ambilDraft('baru').b : null;
  el.append(
    ...Object.keys(BENTUK).map(b => h('button', {
      type: 'button', class: 'ikon b-' + b + (b === aktif ? ' pilih' : ''),
      title: `${BENTUK[b].label} · maks ${BENTUK[b].maks} huruf`, 'aria-label': BENTUK[b].label,
      onclick: () => pilihBentukBaru(b)
    })),
    aktif ? h('span', { class: 'petunjuk' }, `${BENTUK[aktif].label} · maks ${BENTUK[aktif].maks} huruf`) : []
  );
}

/* ================== RENDER ================== */
function kompos(kunci, parent, ke) {
  const d = ambilDraft(kunci);
  const bt = BENTUK[d.b], maks = bt.maks;
  const hitung = h('span', {}, `${d.t.length}/${maks}`);
  const u = h('input', { type: 'text', class: 'in-nama', placeholder: 'username', maxlength: CONFIG.MAKS_USERNAME, value: d.u,
                         oninput: e => { d.u = e.target.value; } });
  const t = h('textarea', { class: 'in-teks', rows: bt.baris, maxlength: maks, placeholder: parent ? 'Tulis balasan…' : 'Tulis di sini…',
                            oninput: e => { d.t = e.target.value; hitung.textContent = `${d.t.length}/${maks}`; } });
  t.value = d.t; t.style.color = d.w;
  const kartu = h('div', { class: 'kartu tulis b-' + d.b + (d.b === 'persegi' ? '' : ' lain') }, u, t);
  kartu.style.background = KARTU[d.k];

  const pilihanTeks = h('div', { class: 'warna' }, h('span', {}, 'Warna teks:'),
    WARNA.map(w => {
      const b = h('button', { type: 'button', title: w, class: w === d.w ? 'pilih' : '', style: 'background:' + w,
        onclick: () => { d.w = w; t.style.color = w; pilihanTeks.querySelectorAll('button').forEach(x => x.classList.toggle('pilih', x === b)); } });
      return b;
    }));
  const pilihanKartu = h('div', { class: 'warna' }, h('span', {}, 'Warna kartu:'),
    Object.keys(KARTU).map(k => {
      const b = h('button', { type: 'button', title: k, class: k === d.k ? 'pilih' : '', style: 'background:' + KARTU[k],
        onclick: () => { d.k = k; kartu.style.background = KARTU[k]; pilihanKartu.querySelectorAll('button').forEach(x => x.classList.toggle('pilih', x === b)); } });
      return b;
    }));
  // balasan boleh memilih bentuknya sendiri (postingan baru memilih lewat tombol di atas halaman)
  const pilihanBentuk = parent ? h('div', { class: 'bentuk-baris' }, h('span', {}, 'Bentuk:'),
    Object.keys(BENTUK).map(b => h('button', {
      type: 'button', class: 'ikon kecil b-' + b + (b === d.b ? ' pilih' : ''),
      title: `${BENTUK[b].label} · maks ${BENTUK[b].maks} huruf`, 'aria-label': BENTUK[b].label,
      onclick: () => { ubahBentuk(d, b); render(); }
    }))) : null;

  const kirimBtn = h('button', { class: 'btn', type: 'button', onclick: () => kirim(kunci, parent, kirimBtn, ke) }, 'Kirim');
  const batal = h('button', { class: 'btn garis', type: 'button',
    onclick: () => { if (parent) { balasTerbuka = null; balasKe = null; } else komposBuka = false; renderAlat(); render(); } }, 'Batal');
  const kontrol = h('div', { class: 'kontrol' }, pilihanBentuk, pilihanTeks, pilihanKartu,
    h('div', { class: 'baris' }, hitung, h('span', { class: 'tombol' }, batal, kirimBtn)));
  return h('div', { class: 'kompos' + (parent ? ' popup' : '') }, ke ? h('div', { class: 'ke' }, '↳ membalas @' + ke.username) : null, kartu, kontrol);
}
function tombolVote(p) {
  const s = sayaVote[p.id] || 0;
  const klik = n => e => { e.stopPropagation(); vote(p.id, n, e.currentTarget); };
  return h('div', { class: 'aksi' },
    h('button', { class: 'btn garis' + (s === 1 ? ' aktif' : ''), onclick: klik(1), title: 'Naikkan', 'aria-label': 'Naikkan, ' + p.up + ' suara' }, '↑ ' + p.up),
    h('button', { class: 'btn garis' + (s === -1 ? ' aktif' : ''), onclick: klik(-1), title: 'Turunkan', 'aria-label': 'Turunkan, ' + p.down + ' suara' }, '↓ ' + p.down));
}
const isiKartu = p => [
  h('div', { class: 'kepala' },
    h('div', {}, h('div', { class: 'nama' }, p.username, p.dosen ? h('span', { class: 'lencana', title: 'Dosen terverifikasi', 'aria-label': 'Dosen terverifikasi' }, '✓') : null), h('div', { class: 'waktu' }, fmt(p.waktu))),
    tombolVote(p)),
  p.membalas ? h('div', { class: 'membalas' }, '↳ membalas @' + p.membalas) : null,
  h('p', { class: 'teks', style: 'color:' + p.warna }, p.teks)
];
function gulirKompos() {
  requestAnimationFrame(() => { const k = document.querySelector('.kompos'); if (k) k.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); });
}
function bukaDek(id) {
  dekBuka = id;
  if (balasTerbuka && balasTerbuka !== id) { balasTerbuka = null; balasKe = null; }   // kotak tulis ikut tertutup bila tumpukannya tertutup
}
function kartuBalasan(p, i, n, prev, setelahKompos) {
  const lain = p.bentuk !== 'persegi';
  const langkah = n > 1 ? Math.min(14, 56 / (n - 1)) : 0;   // geser kanan per tingkat
  const geser = ((n - 1) * langkah).toFixed(1);
  const balasBtn = h('div', { class: 'bawah' }, h('button', { class: 'btn', onclick: e => {
    e.stopPropagation();
    if (balasTerbuka === p.parent && balasKe === p.id) { balasTerbuka = null; balasKe = null; }
    else { bukaDek(p.parent); balasTerbuka = p.parent; balasKe = p.id; }
    render(); gulirKompos();
  } }, 'Reply'));
  const el = h('div', { class: 'balas' + (lain ? ' kartu lain b-' + p.bentuk : '') }, isiKartu(p), balasBtn);
  // bentuk selain persegi punya sudut kosong, jadi digeser lebih ke samping agar tumpukan terlihat jelas
  const ekstra = lain ? 22 : 0;
  el.style.marginLeft = (i * langkah + (i > 0 ? ekstra : 0)).toFixed(1) + 'px';
  el.style.width = lain ? `min(280px, calc(100% - ${geser}px - ${ekstra}px))` : `calc(100% - ${geser}px)`;
  // jarak antar balasan: kartu depan menutupi sebagian kartu belakang
  let mt = 0;
  if (i > 0) {
    const prevLain = prev.bentuk !== 'persegi';
    if (lain) mt = prev.bentuk === 'persegi' ? -40 : -64;   // bentuk lain naik lebih tinggi, menutupi sudut kosong kartu di bawahnya
    else mt = prevLain ? -14 : 6;
  }
  if (setelahKompos) mt = 12;   // kotak tulis ada di atasnya, jangan saling menutupi
  el.style.marginTop = mt + 'px';
  // tiap balasan memakai warna pilihan pengirimnya; makin ke depan makin terang agar tumpukan terlihat berlapis
  el.style.background = `color-mix(in srgb, ${KARTU[p.kartu]}, #fff ${((i + 1) * Math.min(10, 40 / n)).toFixed(1)}%)`;
  // tempelan acak (tetap sama untuk balasan yang sama): sedikit miring dan bergeser
  const rot = (acak(p.id, 'rr') - .5) * 5;     // sekitar ±2.5 derajat
  const dx = (acak(p.id, 'rx') - .5) * 10;     // sekitar ±5px
  const dy = (acak(p.id, 'ry') - .5) * 6;      // sekitar ±3px
  el.style.transform = `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px) rotate(${rot.toFixed(2)}deg)`;
  return el;
}
// urutan tumpukan: balasan utama menurut skor/waktu; balasan atas balasan menempel tepat di bawah tujuannya (lama ke baru)
function susunBalasan(daftar) {
  const ada = new Set(daftar.map(b => b.id));
  const tujuan = b => {
    if (b.ke && ada.has(b.ke)) return b.ke;
    if (!b.membalas) return '';
    // data lama tanpa id tujuan: cari balasan terbaru sebelumnya dengan username itu
    const c = daftar.filter(x => x.id !== b.id && x.username === b.membalas && String(x.waktu) <= String(b.waktu))
                    .sort((x, y) => String(y.waktu).localeCompare(String(x.waktu)))[0];
    return c ? c.id : '';
  };
  const anak = {}, atas = [];
  daftar.forEach(b => { const t = tujuan(b); if (t) (anak[t] = anak[t] || []).push(b); else atas.push(b); });
  Object.values(anak).forEach(a => a.sort((x, y) => String(x.waktu).localeCompare(String(y.waktu))));
  const hasil = [], terpakai = new Set();
  const taruh = b => { if (terpakai.has(b.id)) return; terpakai.add(b.id); hasil.push(b); (anak[b.id] || []).forEach(taruh); };
  atas.forEach(taruh);
  daftar.forEach(taruh);   // pengaman bila ada rantai melingkar
  return hasil;
}
function kartuUtama(p, balasan) {
  balasan = susunBalasan(balasan);
  const lain = p.bentuk !== 'persegi';
  const n = balasan.length;
  const buka = dekBuka === p.id;
  const lapisan = n && !buka ? Math.min(n, 3) : 0;
  const item = h('div', { class: 'item' });
  item.style.setProperty('--dx', ((acak(p.id, 'x') - .5) * 20).toFixed(1) + 'px');
  item.style.setProperty('--rot', ((acak(p.id, 'r') - .5) * 2.4).toFixed(2) + 'deg');
  item.style.setProperty('--dy', (acak(p.id, 'y') * 16).toFixed(1) + 'px');
  const bawah = h('div', { class: 'bawah' },
    h('button', { class: 'btn', onclick: e => {
      e.stopPropagation();
      if (balasTerbuka === p.id && !balasKe) { balasTerbuka = null; }
      else { bukaDek(p.id); balasTerbuka = p.id; balasKe = null; }
      render(); gulirKompos();
    } }, 'Reply'),
    n ? h('span', {}, n + ' balasan ', h('span', { class: 'panah' }, buka ? '▴' : '▾')) : null);
  const kartu = h('article', { class: 'kartu b-' + p.bentuk + (lain ? ' lain' : '') }, isiKartu(p), bawah);
  kartu.style.background = `color-mix(in srgb, ${KARTU[p.kartu]} 92%, #000)`;   // lapisan paling depan dalam deck
  const dek = h('div', { class: 'deck' + (n ? ' berbalas' : '') });
  if (n) {
    kartu.title = buka ? 'Klik untuk menutup tumpukan' : 'Klik untuk membuka tumpukan';
    kartu.onclick = () => {
      if (buka) { dekBuka = null; if (balasTerbuka === p.id) { balasTerbuka = null; balasKe = null; } } else bukaDek(p.id);
      render();
    };
  }
  // tumpukan tertutup: balasan mengintip di belakang kartu utama
  for (let i = lapisan - 1; i >= 0; i--) {
    const b = balasan[i];
    const l = h('div', { class: 'lapis kartu b-' + p.bentuk + (lain ? ' lain' : '') });
    l.style.background = `color-mix(in srgb, ${KARTU[b.kartu]}, #000 ${12 + i * 7}%)`;
    const rot = (acak(b.id, 'lr') - .5) * 3;
    const gx = lain ? 7 * (i + 1) : (acak(b.id, 'lx') - .5) * 10;
    const gy = lain ? 7 * (i + 1) : 7 * (i + 1);
    l.style.transform = `translate(${gx.toFixed(1)}px, ${gy}px) rotate(${rot.toFixed(2)}deg)`;
    dek.append(l);
  }
  dek.append(kartu);
  item.append(dek);
  if (lapisan) item.style.marginBottom = (lapisan * 7 + 8) + 'px';
  // kotak tulis muncul langsung di bawah kartu yang dibalas
  const ke = balasTerbuka === p.id && balasKe ? balasan.find(b => b.id === balasKe) : null;
  const kotakTulis = () => kompos(ke ? ke.id : p.id, p.id, ke);
  if (balasTerbuka === p.id && !ke) item.append(kotakTulis());
  if (buka && n) {
    const isi = [];
    balasan.forEach((b, i) => {
      isi.push(kartuBalasan(b, i, n, balasan[i - 1], i > 0 && !!ke && balasan[i - 1].id === ke.id));
      if (ke && b.id === ke.id) isi.push(kotakTulis());
    });
    item.append(h('div', { class: 'tumpukan' }, isi));
  }
  return item;
}

/* ---------- Latar titik: titik menjauh dari kursor mouse ---------- */
const TITIK = { jarak: 22, jari: 1.2, warna: '#9a9a9a', dorong: 38, radius: 130, kecepatan: .14 };
const titik = { kanvas: null, ctx: null, mx: -9999, my: -9999, geser: new Map(), jalan: false, kurang: false };
function titikUkuran() {
  const k = titik.kanvas, d = window.devicePixelRatio || 1;
  k.width = Math.round(innerWidth * d); k.height = Math.round(innerHeight * d);
  titik.ctx = k.getContext('2d'); titik.ctx.setTransform(d, 0, 0, d, 0, 0);
}
// target pergeseran satu titik: didorong menjauhi kursor (koordinat layar)
function titikTarget(x, y) {
  const dx = x - titik.mx, dy = y - titik.my, R = TITIK.radius;
  const d2 = dx * dx + dy * dy;
  if (d2 >= R * R) return [0, 0];
  const d = Math.sqrt(d2) || 1;
  const kuat = Math.pow(1 - d / R, 1.6) * TITIK.dorong;
  return [dx / d * kuat, dy / d * kuat];
}
function titikGambar() {
  const c = titik.ctx, J = TITIK.jarak;
  c.clearRect(0, 0, innerWidth, innerHeight);
  c.fillStyle = TITIK.warna;
  const k0 = Math.floor(scrollY / J) - 1, k1 = Math.ceil((scrollY + innerHeight) / J) + 1;
  const i1 = Math.ceil(innerWidth / J) + 1;
  let bergerak = false;
  c.beginPath();
  for (let k = k0; k <= k1; k++) {
    for (let i = 0; i <= i1; i++) {
      const x = i * J + J / 2, y = k * J + J / 2 - scrollY;   // y = posisi di layar
      const [tx, ty] = titikTarget(x, y);
      const kunci = (k + 1000) * 4096 + i;
      let g = titik.geser.get(kunci);
      if (!g) {
        if (!tx && !ty) { c.moveTo(x + TITIK.jari, y); c.arc(x, y, TITIK.jari, 0, 6.2832); continue; }
        g = { x: 0, y: 0 }; titik.geser.set(kunci, g);
      }
      if (titik.kurang) { g.x = tx; g.y = ty; }
      else {
        g.x += (tx - g.x) * TITIK.kecepatan; g.y += (ty - g.y) * TITIK.kecepatan;
        if (Math.abs(tx - g.x) > .05 || Math.abs(ty - g.y) > .05) bergerak = true; else { g.x = tx; g.y = ty; }
      }
      if (!tx && !ty && !g.x && !g.y) titik.geser.delete(kunci);
      c.moveTo(x + g.x + TITIK.jari, y + g.y); c.arc(x + g.x, y + g.y, TITIK.jari, 0, 6.2832);
    }
  }
  c.fill();
  titik.jalan = bergerak;
  if (bergerak) requestAnimationFrame(titikGambar);
}
function titikMinta() { if (!titik.jalan) { titik.jalan = true; requestAnimationFrame(titikGambar); } }
function titikMulai() {
  titik.kanvas = document.getElementById('titik');
  titik.kurang = matchMedia('(prefers-reduced-motion: reduce)').matches;
  titikUkuran(); titikMinta();
  const arah = e => { titik.mx = e.clientX; titik.my = e.clientY; titikMinta(); };
  const pergi = () => { titik.mx = titik.my = -9999; titikMinta(); };
  addEventListener('pointermove', arah, { passive: true });
  addEventListener('pointerdown', arah, { passive: true });
  addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') pergi(); });
  document.documentElement.addEventListener('mouseleave', pergi);
  addEventListener('blur', pergi);
  addEventListener('resize', () => { titikUkuran(); titikMinta(); });
  addEventListener('scroll', titikMinta, { passive: true });
}
function render() {
  const dek = document.getElementById('dek'); dek.innerHTML = '';
  if (komposBuka) dek.append(h('div', { class: 'item' }, kompos('baru', '')));
  const all = semua();
  const utama = all.filter(p => !p.parent).sort(urut);
  const anak = {};
  all.filter(p => p.parent).forEach(p => (anak[p.parent] = anak[p.parent] || []).push(p));
  utama.forEach(p => dek.append(kartuUtama(p, (anak[p.id] || []).sort(urut))));
}

/* ================== TIMER MINGGUAN (Senin 00.00 - Minggu 23.59 WIB) ================== */
function sisaPekan(sekarang) {
  const WIB = 7 * 3600 * 1000;
  const s = new Date(sekarang + WIB);                    // jam dinding WIB, dibaca lewat fungsi UTC
  const hariKeSenin = (8 - s.getUTCDay()) % 7 || 7;      // 0=Minggu ... 6=Sabtu; Senin 00.00 menghasilkan 7
  const akhir = Date.UTC(s.getUTCFullYear(), s.getUTCMonth(), s.getUTCDate() + hariKeSenin) - WIB;
  return akhir - sekarang;                               // milidetik sampai Senin 00.00 WIB berikutnya
}
function teksTimer(ms) {
  const dua = n => String(n).padStart(2, '0');
  const hari = Math.floor(ms / 86400000), jam = Math.floor(ms % 86400000 / 3600000);
  const menit = Math.floor(ms % 3600000 / 60000), detik = Math.floor(ms % 60000 / 1000);
  if (hari > 0) return `${hari} hari : ${dua(jam)} jam`;
  if (jam > 0) return `${jam} jam : ${dua(menit)} menit`;
  return `${menit} menit : ${dua(detik)} detik`;
}
function tickTimer() {
  const el = document.getElementById('timer');
  if (el) el.textContent = 'Papan ini di-reset seminggu sekali. Sisa waktu tempel catatan minggu ini: ' + teksTimer(sisaPekan(Date.now()));
}

/* ================== MULAI ================== */
(function mulai() {
  const b = document.getElementById('banner');
  if (!siap(CONFIG.SCRIPT_URL) || !siap(CONFIG.GOOGLE_CLIENT_ID) || (!siap(CONFIG.CSV_URL) && !siap(CONFIG.SCRIPT_URL))) {
    b.append(h('div', {}, 'Konfigurasi belum lengkap: isi SCRIPT_URL, CSV_URL, dan GOOGLE_CLIENT_ID di bagian CONFIG pada index.html.'));
  }
  if (!tokenHidup()) { token = ''; sessionStorage.removeItem('tok'); }
  renderAlat(); render(); muat();
  tickTimer(); setInterval(tickTimer, 1000);
  titikMulai();
  setInterval(() => muat(true), CONFIG.REFRESH_MS);
  initGoogle();
  if (tokenHidup() && siap(CONFIG.SCRIPT_URL)) sapa();
})();
